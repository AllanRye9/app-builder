name: Build APK

# Triggered by api/start-build.js via a repository_dispatch call, not by
# pushes to this repo — this workflow's only job is to be an on-demand,
# always-fresh build worker for whatever project zip it's handed.
on:
  repository_dispatch:
    types: [build-apk]

run-name: "Build ${{ github.event.client_payload.filename }} (${{ github.event.client_payload.job_id }})"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_ID: ${{ github.event.client_payload.job_id }}
      ZIP_URL: ${{ github.event.client_payload.zip_url }}
      FILENAME: ${{ github.event.client_payload.filename }}
      CALLBACK_BASE: ${{ github.event.client_payload.callback_base }}
      CALLBACK_SECRET: ${{ github.event.client_payload.callback_secret }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      APP_ID: com.builder.app
      APP_NAME: MyApp

    steps:
      - name: Report started
        run: |
          curl -fsS -X POST "$CALLBACK_BASE/api/build-progress" \
            -H "Content-Type: application/json" \
            -d "$(node -e 'console.log(JSON.stringify({jobId:process.env.JOB_ID,status:"validating",runUrl:process.env.RUN_URL,secret:process.env.CALLBACK_SECRET}))')" \
            || echo "::warning::Progress callback failed — continuing the build regardless."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download and extract project
        run: |
          set -euo pipefail
          mkdir -p project
          curl -fsSL "$ZIP_URL" -o project.zip
          unzip -q project.zip -d project_raw

          # If the zip wrapped everything in one top-level folder, use that
          # folder's contents as the project root instead.
          entries=(project_raw/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ] && [ -f "${entries[0]}/package.json" ]; then
            mv "${entries[0]}"/* "${entries[0]}"/.[!.]* project/ 2>/dev/null || true
          else
            mv project_raw/* project_raw/.[!.]* project/ 2>/dev/null || true
          fi

          if [ ! -f project/package.json ]; then
            echo "No package.json found at the project root." >&2
            exit 1
          fi
          for bad in android ios platforms capacitor.config.json capacitor.config.ts; do
            if [ -e "project/$bad" ]; then
              echo "Archive already contains $bad — this is generated by the build, remove it from the zip." >&2
              exit 1
            fi
          done

      - name: Report building
        run: |
          curl -fsS -X POST "$CALLBACK_BASE/api/build-progress" \
            -H "Content-Type: application/json" \
            -d "$(node -e 'console.log(JSON.stringify({jobId:process.env.JOB_ID,status:"building",secret:process.env.CALLBACK_SECRET}))')" \
            || echo "::warning::Progress callback failed — continuing the build regardless."

      - name: Install dependencies and build web app
        working-directory: project
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Detect web build output directory
        working-directory: project
        run: |
          set -euo pipefail
          for d in dist build www out; do
            if [ -d "$d" ]; then
              WEB_DIR="$d"
              echo "WEB_DIR=$d" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${WEB_DIR:-}" ]; then
            echo "Couldn't find a web build output folder (looked for dist/, build/, www/, out/)." >&2
            exit 1
          fi

      - name: Add Capacitor Android
        working-directory: project
        run: |
          set -euo pipefail
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "$APP_NAME" "$APP_ID" --web-dir="$WEB_DIR"
          npx cap add android
          npx cap copy android

      - name: Build debug APK
        working-directory: project/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Blob storage
        if: success()
        run: |
          set -euo pipefail
          npm install @vercel/blob@^0.27.0 --no-save
          node -e '
            const { put } = require("@vercel/blob");
            const fs = require("fs");
            (async () => {
              const apkPath = "project/android/app/build/outputs/apk/debug/app-debug.apk";
              const buf = fs.readFileSync(apkPath);
              const name = (process.env.FILENAME || "app").replace(/\.zip$/i, "");
              const { url } = await put(`apks/${process.env.JOB_ID}/${name}.apk`, buf, {
                access: "public",
                contentType: "application/vnd.android.package-archive",
                addRandomSuffix: false,
              });
              fs.writeFileSync(process.env.GITHUB_ENV, `APK_URL=${url}\n`, { flag: "a" });
            })().catch((err) => { console.error(err); process.exit(1); });
          '
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -fsS -X POST "$CALLBACK_BASE/api/build-complete" \
              -H "Content-Type: application/json" \
              -d "$(node -e 'console.log(JSON.stringify({jobId:process.env.JOB_ID,status:"success",apkUrl:process.env.APK_URL,secret:process.env.CALLBACK_SECRET}))')" \
              || echo "::warning::Result callback failed — the run log is still the source of truth."
          else
            curl -fsS -X POST "$CALLBACK_BASE/api/build-complete" \
              -H "Content-Type: application/json" \
              -d "$(node -e 'console.log(JSON.stringify({jobId:process.env.JOB_ID,status:"failed",error:"Build failed — see the full log: " + process.env.RUN_URL,secret:process.env.CALLBACK_SECRET}))')" \
              || echo "::warning::Result callback failed — the run log is still the source of truth."
          fi
