name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the code from the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # DEBUG: Check if DOCKER_USERNAME secret exists
    - name: Debug secrets
      run: |
        if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
          echo "DOCKER_USERNAME is set"
        else
          echo "DOCKER_USERNAME is NOT set"
          echo "::error::DOCKER_USERNAME secret is missing!"
          exit 1
        fi

    # 2. Set up QEMU for multi-platform builds
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # 3. Initialize Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Authenticate to the Docker registry
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Extract Docker metadata
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/apkit
        tags: |
          type=raw,value=latest
          type=sha,format=short

    # 6. Build and push Docker image
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
