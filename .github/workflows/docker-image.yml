name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 1: Authenticate with Docker Hub using secure secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 2: Build the image with your Docker Hub username and standard tags
    - name: Build and tag Docker image
      run: |
        docker build . \
          --file Dockerfile \
          --tag ${{ secrets.DOCKERHUB_USERNAME }}/apkit:1.0.0 \
          --tag ${{ secrets.DOCKERHUB_USERNAME }}/apkit:latest

    # Step 3: Push the tagged image to Docker Hub
    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/apkit:1.0.0
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/apkit:latest
