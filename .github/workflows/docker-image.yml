name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the code from the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # DEBUG: Check if DOCKER_USERNAME secret exists.
    # Only enforced when we're actually about to push (a real push to main) — PRs,
    # including ones from forks, never receive repo secrets and never push, so they
    # must not be blocked on this.
    - name: Debug secrets
      if: github.event_name != 'pull_request'
      run: |
        if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
          echo "DOCKER_USERNAME is set"
        else
          echo "DOCKER_USERNAME is NOT set"
          echo "::error::DOCKER_USERNAME secret is missing!"
          exit 1
        fi

    # 2. Set up QEMU for multi-platform builds
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # 3. Initialize Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Authenticate to the Docker registry
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Extract Docker metadata with ry versioning
    # Image name must NOT depend on a secret: secrets are empty on PR runs (especially
    # from forks), which previously produced an invalid "/apkit" ref and broke the
    # build step even though PRs never push. Fall back to the repo owner's name so the
    # build always has a valid tag, with or without secrets being present.
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME || github.repository_owner }}/apkit
        tags: |
          type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
          type=raw,value=ry-${{ github.run_number }}
          type=raw,value=ry-${{ github.run_number }}-{{sha}}
          type=sha,format=short,prefix=sha-
          type=ref,event=branch
          type=ref,event=pr
        flavor: |
          latest=false

    # 6. Build and push Docker image with ry versioned tags
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_VERSION=ry-${{ github.run_number }}
          BUILD_SHA=${{ github.sha }}
          BUILD_DATE=${{ github.event.repository.updated_at }}
