# Secrets (githubToken, githubOwner, githubRepo, callbackSecret) and
# dataDir live in config.json on the mounted Disk below, not as Render
# env vars — see config.example.json. After the first deploy, open the
# service's "Shell" tab in the Render dashboard and create /data/config.json
# (server/config.js checks that path automatically):
#   cat > /data/config.json <<'EOF'
#   { "githubToken": "...", "githubOwner": "...", "githubRepo": "...",
#     "callbackSecret": "...", "dataDir": "/data" }
#   EOF
services:
  - type: web
    name: apk-builder
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    disk:
      name: apk-builder-data
      mountPath: /data
      sizeGB: 1
