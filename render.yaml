# Optional. Only used if you deploy via Render's "New -> Blueprint" flow.
# Every other platform in the README ignores this file — this app has no
# dependency on it beyond convenience.
services:
  - type: web
    name: apk-builder
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: MAX_CONCURRENT_BUILDS
        value: "2"
      - key: BUILD_TIMEOUT_MS
        value: "900000"
      - key: MAX_UPLOAD_BYTES
        value: "314572800"
      - key: JOB_TTL_MS
        value: "3600000"
      - key: RATE_LIMIT_MAX
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "600000"
      - key: APP_ID
        value: com.builder.app
      - key: APP_NAME
        value: MyApp
