services:
  - type: web
    name: apk-builder
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: MAX_CONCURRENT_BUILDS
        value: "2"
      - key: BUILD_TIMEOUT_MS
        value: "900000"
      - key: MAX_UPLOAD_BYTES
        value: "314572800"
      - key: JOB_TTL_MS
        value: "3600000"
      - key: RATE_LIMIT_MAX
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "600000"
      - key: APP_ID
        value: com.builder.app
      - key: APP_NAME
        value: MyApp
    # No disk: block here on purpose. Job workspaces are meant to be
    # temporary (cleaned up by jobStore.js's own TTL sweep) — an attached
    # persistent disk would survive across deploys for no benefit here, and
    # Render disks also pin you to a single instance (no autoscaling).
