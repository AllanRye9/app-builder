services:
  apk-builder:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MAX_CONCURRENT_BUILDS=2
      - BUILD_TIMEOUT_MS=900000
      - MAX_UPLOAD_BYTES=314572800
      - JOB_TTL_MS=3600000
      - RATE_LIMIT_MAX=10
      - RATE_LIMIT_WINDOW_MS=600000
      - APP_ID=com.builder.app
      - APP_NAME=MyApp
    restart: unless-stopped
